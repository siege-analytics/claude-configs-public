name: publish-consumption-tags

# Repair missing consumer tags only from the authorized producer's exact release
# handoff. Moving release branches are never an input. Older releases without a
# manifest fail explicitly; they require a separately reviewed provenance record.
on:
  release:
    types: [published]

concurrency:
  group: consumption-tags-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Verify and repair four exact consumer tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable handoff and verify output identities
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir /tmp/release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/release-assets --pattern release-manifest.json --pattern '*.tar.gz'
          SOURCE=$(git rev-parse HEAD)
          python3 scripts/ci/release-handoff.py publish --fetch \
            --assets /tmp/release-assets --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source "$SOURCE"
