name: pr-base-guard

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:

permissions:
  contents: read

jobs:
  check-base:
    name: Require canonical branch topology
    runs-on: ubuntu-latest
    steps:
      # Since 2025-12-08, pull_request_target loads this workflow from the
      # repository default branch (main), not the PR base. This registered
      # workflow checks out the exact PR base as trusted policy and executes its
      # check-branch-topology.sh entrypoint. Checked-out YAML is not represented
      # as the workflow GitHub executed. Candidate code remains data only.
      - name: Check out trusted policy
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          fetch-depth: 0  # selected policy snapshot must be an available ancestor
          persist-credentials: false

      - name: Check out candidate as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch canonical main for PR
        if: github.event_name == 'pull_request_target'
        working-directory: candidate
        run: git fetch --no-tags https://github.com/${{ github.repository }}.git refs/heads/main:refs/remotes/upstream/main

      - name: Enforce integration and promotion path
        if: github.event_name == 'pull_request_target'
        working-directory: candidate
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CANONICAL_REPO: ${{ github.repository }}
          MAIN_REF: upstream/main
        run: bash ../policy/scripts/ci/check-branch-topology.sh

      # Merge queues have already admitted a PR through the head-role check.
      # The queued synthetic commit must still contain current main.
      - name: Check out merge-group candidate
        if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate merge-group ancestry
        if: github.event_name == 'merge_group'
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "BLOCKED: merge-group candidate does not contain current main."
            exit 1
          }
          echo "PASS: merge-group candidate contains current main."
