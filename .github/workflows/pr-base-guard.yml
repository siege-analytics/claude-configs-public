name: pr-base-guard

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:

permissions:
  contents: read

jobs:
  check-base:
    name: Require canonical branch topology
    runs-on: ubuntu-latest
    steps:
      # pull_request_target loads this workflow from the protected base branch.
      # Keep policy and candidate in separate directories and never execute code
      # from the untrusted candidate checkout.
      - name: Check out trusted policy
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          fetch-depth: 0  # selected policy snapshot must be an available ancestor
          persist-credentials: false

      - name: Check out candidate as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch canonical main for PR
        if: github.event_name == 'pull_request_target'
        working-directory: candidate
        run: git fetch --no-tags https://github.com/${{ github.repository }}.git refs/heads/main:refs/remotes/upstream/main

      - name: Enforce integration and promotion path
        if: github.event_name == 'pull_request_target'
        working-directory: candidate
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CANONICAL_REPO: ${{ github.repository }}
          MAIN_REF: upstream/main
        run: bash ../policy/scripts/ci/check-branch-topology.sh

      # This PR cannot prove this step: pull_request_target loads it from the
      # protected base. After integration, #1003 must exercise a subsequent
      # exact head and independently record that this existing check is required.
      - name: Evaluate exact project policy range
        if: github.event_name == 'pull_request_target'
        working-directory: candidate
        env:
          POLICY_REVISION: ${{ github.event.pull_request.base.sha }}
          EXACT_BASE: ${{ github.event.pull_request.base.sha }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          CANONICAL_REPOSITORY: ${{ github.repository }}
          CANONICAL_SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          CANONICAL_HOST="${CANONICAL_SERVER#https://}"
          python3 ../policy/scripts/ci/protected-policy-range.py \
            --trusted-root ../policy --trusted-revision "$POLICY_REVISION" \
            --candidate-repo . --base "$EXACT_BASE" --head "$EXACT_HEAD" \
            --canonical-identity "$CANONICAL_HOST/$CANONICAL_REPOSITORY" \
            --head-branch "$HEAD_BRANCH" --target-branch "$TARGET_BRANCH" \
            --receipt /tmp/protected-policy-receipt.json

      # Merge queues have already admitted a PR through the head-role check.
      # The queued synthetic commit must still contain current main.
      - name: Check out merge-group candidate
        if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate merge-group ancestry
        if: github.event_name == 'merge_group'
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "BLOCKED: merge-group candidate does not contain current main."
            exit 1
          }
          echo "PASS: merge-group candidate contains current main."
