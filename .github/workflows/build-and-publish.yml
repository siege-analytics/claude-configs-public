name: build-and-publish

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:

jobs:
  validate:
    name: Validate references and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # lifecycle ratchets compare append-only state to the protected base

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for path-form references that should be tokens
        run: python3 bin/sync-skill-references.py --check

      - name: Shelf ownership and actionable path integrity
        run: |
          python3 bin/_test/check_shelf_owners_test.py
          python3 bin/_test/check_shelf_paths_test.py
          python3 bin/check-shelf-owners.py
          python3 bin/check-shelf-paths.py

      - name: Validate token resolution (build --check)
        run: python3 bin/build.py --check

      - name: Full build for hook validation
        run: python3 bin/build.py

      - name: Gate contract and generated agreement
        run: |
          python3 bin/_test/gate_contract_test.py
          python3 bin/gate_contract.py --check --probe --generated-root dist
          python3 bin/_test/effective_policy_test.py
          python3 bin/effective_policy.py validate --generated-root dist

      - name: Bounded work coordination and recovery
        run: |
          python3 bin/_test/work_cycle_test.py
          python3 bin/ontology.py --validate-bindings examples/coordination/ontology-bindings.json
          for pkg in claude-code craft-agent; do
            python3 "dist/$pkg/skills/drive-while-away/scripts/work_cycle.py" examples/coordination/work-cycle.json
          done

      - name: Project procedure and resident composition
        run: |
          python3 bin/_test/procedure_composition_test.py
          python3 bin/_test/project_composition_test.py
          python3 bin/_test/resident_delivery_test.py
          python3 bin/ontology.py --validate-bindings examples/composition/ontology-bindings.json

      - name: Canonical terminology and generated wiki
        run: |
          python3 bin/_test/ontology_test.py
          python3 bin/ontology.py --check

      - name: Generated source authority and drift
        run: |
          python3 bin/_test/generated_source_authority_test.py
          python3 bin/generated-source-authority.py --check

      - name: Compact safety kernel structure and budget
        run: |
          python3 bin/_test/kernel_budget_test.py
          python3 bin/kernel-budget.py --check

      - name: Proportional review risk policy
        run: |
          python3 bin/_test/review_risk_test.py
          bash hooks/_test/review_risk_policy.test.sh
          python3 bin/review-risk-metrics.py --check
          for pkg in claude-code craft-agent; do
            test -f "dist/$pkg/bin/review-risk.py"
            test -f "dist/$pkg/catalog/review-risk-policy.json"
          done

      - name: Deterministic progressive loading
        run: |
          python3 bin/_test/resolve_load_set_test.py
          python3 bin/_test/billing_diagnostic_test.py
          python3 bin/_test/progressive_mount_test.py
          python3 bin/_test/consumer_runtime_test.py
          bash hooks/_test/progressive_loading.test.sh
          python3 bin/progressive-loading-metrics.py --check
          python3 bin/_test/language_scope_test.py
          python3 bin/language-scope.py --check
          python3 bin/_test/data_scope_test.py
          python3 bin/data-scope.py --check
          for pkg in claude-code craft-agent; do
            test -f "dist/$pkg/bin/resolve-load-set.py"
            test -f "dist/$pkg/catalog/resolver-manifest.json"
            python3 "dist/$pkg/bin/resolve-load-set.py" --prompt "review this Python diff" --repo other/repo | grep -q '"state": "matched"'
          done

      - name: Validate Craft Agent flat skill layout
        run: bash scripts/ci/test_flat_skill_layout.sh

      - name: Validate hook installation (claude-code)
        run: python3 bin/validate-hooks.py dist/claude-code/

      - name: Validate hook installation (craft-agent)
        run: python3 bin/validate-hooks.py dist/craft-agent/

      - name: Validate repo hooks match snippet
        run: python3 bin/validate-hooks.py

      - name: Coherent package upgrade and rollback fixtures
        run: python3 bin/_test/package_generation_test.py

      - name: Consumer package documentation and clean-home diagnostics
        run: python3 bin/_test/package_documentation_test.py

      - name: Shared-parent registered provider events
        run: python3 bin/_test/provider_event_test.py

      - name: Native consumer Git registration and destination range
        run: python3 bin/_test/native_push_test.py

      - name: Settings-drift check fixtures
        run: python3 bin/_test/settings_drift_test.py

      - name: Scanner selected-source truth and incomplete results
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 bin/_test/scanner_source_test.py
          for test_file in skills/detect-ai-fingerprints/test_*.sh; do
            bash "$test_file"
          done
          python3 skills/detect-ai-fingerprints/scan_ast.py \
            skills/detect-ai-fingerprints/scan_ast.py \
            skills/detect-ai-fingerprints/scan_snapshot.py
          python3 -c 'from pathlib import Path; assert not list(Path("skills/detect-ai-fingerprints").rglob("*.pyc")), "scanner suite left packageable bytecode"'
          python3 bin/generated-source-authority.py --check

      - name: NotebookEdit write-guard fixtures
        run: python3 bin/_test/notebook_edit_guards_test.py

      - name: Branch topology policy fixtures
        run: bash .github/workflows/_test_pr_base_guard_policy.sh

      - name: Main-only release policy fixtures
        run: |
          bash .github/workflows/_test_release_source_policy.sh
          python3 bin/_test/release_handoff_test.py

      - name: Exact-main deployment source fixtures
        run: python3 bin/_test/deploy_source_policy_test.py

      - name: Skill inventory fixtures and freshness
        run: |
          python3 bin/_test/skill_inventory_test.py
          python3 bin/skill-inventory.py --check

      - name: Resolve first-promotion push provenance
        id: lifecycle-promotion
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == 'b2d91ef2900f58ddb37c10e1eb2803a7aeaa6753' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: context.sha, per_page: 100 },
            );
            const canonical = associated.filter((pr) =>
              pr.merged_at !== null &&
              pr.merge_commit_sha === context.sha &&
              pr.base.ref === 'main' &&
              pr.head.ref === 'develop' &&
              pr.head.repo?.full_name === fullName
            );
            if (canonical.length !== 1) {
              core.setFailed(
                `Expected exactly one merged canonical develop -> main PR for ${context.sha}; found ${canonical.length}`
              );
              return '';
            }
            return canonical[0].head.sha;

      - name: Skill lifecycle schema and migration ratchet
        env:
          LIFECYCLE_PREVIOUS_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha || '' }}
          LIFECYCLE_EVENT_NAME: ${{ github.event_name }}
          LIFECYCLE_BASE_REF: ${{ github.base_ref || '' }}
          LIFECYCLE_HEAD_REF: ${{ github.head_ref || '' }}
          LIFECYCLE_EVENT_REF: ${{ github.ref }}
          LIFECYCLE_REPOSITORY: ${{ github.repository }}
          LIFECYCLE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          LIFECYCLE_PROMOTION_REF: ${{ github.event.pull_request.head.sha || steps.lifecycle-promotion.outputs.result || '' }}
        run: |
          python3 bin/_test/skill_lifecycle_test.py
          python3 bin/skill-lifecycle.py --check

      # A bare `for f in ...; do bash "$f"; done` exits with the status of the
      # LAST file, so a failure in any other file is invisible. Failures are
      # accumulated and the step exits non-zero if any file failed. An empty
      # glob is a failure rather than a silent pass. Ref: #713
      - name: Hook scenario tests
        run: |
          shopt -s nullglob
          files=(hooks/_test/*.test.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files matched hooks/_test/*.test.sh; refusing to report success."
            exit 1
          fi
          failed=""
          for f in "${files[@]}"; do
            echo "::group::$f"
            if bash "$f"; then
              echo "PASS $f"
            else
              echo "FAIL $f"
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failing hook test files:$failed"
            exit 1
          fi
          echo "All ${#files[@]} hook test files passed."
  publish:
    name: Build and publish to release branches
    needs: validate
    # `develop` is integration-only. Publishing, tagging, and releases are
    # authorized exclusively by a successful push/merge to `main`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Serialize main releases so force-updates to the consumer branches cannot
    # race one another.
    concurrency:
      group: publish-release-branches
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history for branch operations

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version
        id: resolve-version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          while git rev-parse "v${MAJOR}.${MINOR}.${PATCH}" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
          done
          RESOLVED="${MAJOR}.${MINOR}.${PATCH}"
          if [ "$RESOLVED" != "$VERSION" ]; then
            echo "$RESOLVED" > VERSION
          fi
          echo "version=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "tag=v${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "bumped=$( [ "$RESOLVED" != "$VERSION" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Prepare versioned changelog before building
        env:
          RELEASE_TAG: ${{ steps.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/ci/promote-unreleased.py --version "$RELEASE_TAG"
          python3 scripts/ci/release-notes.py --version "$RELEASE_TAG" --out /tmp/release-notes.md

      - name: Build dist/nested and dist/flat
        run: python3 bin/build.py

      - name: Stage exact nested output
        run: |
          set -euo pipefail
          # Stage all four outputs locally; publish only after manifest checks.
          # Don't pre-fetch the remote branch — that would create a local ref
          # that conflicts with `worktree add -B`.
          rm -rf /tmp/release-nested
          git branch -D release/nested 2>/dev/null || true
          git worktree add --orphan -B release/nested /tmp/release-nested
          rsync -a --delete --exclude='.git' dist/nested/ /tmp/release-nested/
          (cd /tmp/release-nested && git add --force -A && git commit -m "Publish nested layout from ${GITHUB_SHA}")

      - name: Stage exact flat output
        run: |
          set -euo pipefail
          rm -rf /tmp/release-flat
          git branch -D release/flat 2>/dev/null || true
          git worktree add --orphan -B release/flat /tmp/release-flat
          rsync -a --delete --exclude='.git' dist/flat/ /tmp/release-flat/
          (cd /tmp/release-flat && git add --force -A && git commit -m "Publish flat layout from ${GITHUB_SHA}")

      - name: Stage exact claude-code output
        run: |
          set -euo pipefail
          rm -rf /tmp/release-claude-code
          git branch -D release/claude-code 2>/dev/null || true
          git worktree add --orphan -B release/claude-code /tmp/release-claude-code
          rsync -a --delete --exclude='.git' dist/claude-code/ /tmp/release-claude-code/
          (cd /tmp/release-claude-code && git add --force -A && git commit -m "Publish claude-code package from ${GITHUB_SHA}")

      - name: Stage exact craft-agent output
        run: |
          set -euo pipefail
          rm -rf /tmp/release-craft-agent
          git branch -D release/craft-agent 2>/dev/null || true
          git worktree add --orphan -B release/craft-agent /tmp/release-craft-agent
          rsync -a --delete --exclude='.git' dist/craft-agent/ /tmp/release-craft-agent/
          (cd /tmp/release-craft-agent && git add --force -A && git commit -m "Publish craft-agent package from ${GITHUB_SHA}")

      - name: Record immutable release handoff and archives
        env:
          RELEASE_TAG: ${{ steps.resolve-version.outputs.tag }}
        run: |
          python3 scripts/ci/release-handoff.py record \
            --assets /tmp/release-assets --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source "$GITHUB_SHA"

      - name: Preserve handoff before remote mutation
        uses: actions/upload-artifact@v4
        with:
          name: release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-assets/
          if-no-files-found: error

      - name: Publish exact source, consumer tags and release branches
        env:
          RELEASE_TAG: ${{ steps.resolve-version.outputs.tag }}
        run: |
          python3 scripts/ci/release-handoff.py publish --branches \
            --assets /tmp/release-assets --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source "$GITHUB_SHA"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          printf '\nConsumer tags: `%s-{nested,flat,claude-code,craft-agent}`.\n' "$RELEASE_TAG" >> /tmp/release-notes.md
          printf 'Exact output commits and archive SHA-256 digests: release-manifest.json.\n' >> /tmp/release-notes.md
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            --latest \
            /tmp/release-assets/*
